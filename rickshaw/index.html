<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rickshaw ride through Dhaka · Serat Saad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Hind+Siliguri:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="intro">
    <div class="intro-box">
      <div class="intro-bn">ঢাকা</div>
      <h1>Serat Saad</h1>
      <p class="intro-sub">A rickshaw ride through my work.</p>
      <p class="intro-keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to ride &nbsp;·&nbsp; <kbd>Space</kbd> for the bell</p>
      <p class="intro-keys intro-touch">Arrows to ride &nbsp;·&nbsp; 🔔 for the bell</p>
      <button id="start">Start riding</button>
      <p class="intro-hint">Not every road is on the map.</p>
      <a class="intro-classic" href="../index.html">classic site →</a>
    </div>
  </div>

  <div id="hud">
    <a href="../index.html" class="hud-title">Serat Saad</a>
    <span class="hud-keys"><kbd>Shift</kbd> faster <kbd>C</kbd> camera <kbd>R</kbd> reset</span>
  </div>

  <canvas id="minimap" width="200" height="184"></canvas>

  <div id="card" class="hidden">
    <button class="card-close" aria-label="Close">×</button>
    <div class="card-media"><img class="card-img" alt=""></div>
    <div class="card-body">
      <div class="card-kicker"></div>
      <h2 class="card-title"></h2>
      <p class="card-text"></p>
      <div class="card-links"></div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="touch">
    <button data-k="left">◀</button>
    <button data-k="up">▲</button>
    <button data-k="down">▼</button>
    <button data-k="right">▶</button>
    <button data-k="bell">🔔</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
