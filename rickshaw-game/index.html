<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rickshaw ride around Mirpur 10 · Serat Saad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Hind+Siliguri:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../rickshaw/style.css">
  <style>
    .osm { position: fixed; left: 12px; bottom: 8px; z-index: 5; font-size: 11px; color: #5a4636; text-decoration: none;
      background: rgba(255, 250, 242, .75); padding: 2px 8px; border-radius: 999px; }
    @media (hover: none) and (pointer: coarse) { .osm { left: auto; right: 12px; top: 140px; bottom: auto; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="intro">
    <div class="intro-box">
      <div class="intro-bn">মিরপুর ১০</div>
      <h1>Serat Saad</h1>
      <p class="intro-sub">A rickshaw ride through my work, on the real streets of Mirpur.</p>
      <p class="intro-keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to ride &nbsp;·&nbsp; <kbd>Space</kbd> for the bell</p>
      <p class="intro-keys intro-touch">Arrows to ride &nbsp;·&nbsp; 🔔 for the bell</p>
      <button id="start">Start riding</button>
      <p class="intro-hint">Some stops only show up once you find them.</p>
      <a class="intro-classic" href="../index.html">classic site →</a>
    </div>
  </div>

  <div id="hud">
    <a href="../index.html" class="hud-title">Serat Saad</a>
    <span class="hud-keys"><kbd>Shift</kbd> faster <kbd>C</kbd> camera <kbd>R</kbd> reset</span>
  </div>

  <canvas id="minimap" width="200" height="184"></canvas>

  <div id="card" class="hidden">
    <button class="card-close" aria-label="Close">×</button>
    <div class="card-media"><img class="card-img" alt=""></div>
    <div class="card-body">
      <div class="card-kicker"></div>
      <h2 class="card-title"></h2>
      <p class="card-text"></p>
      <div class="card-links"></div>
    </div>
  </div>

  <div id="toast"></div>
  <a class="osm" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">Map © OpenStreetMap contributors</a>

  <div id="touch">
    <button data-k="left">◀</button>
    <button data-k="up">▲</button>
    <button data-k="down">▼</button>
    <button data-k="right">▶</button>
    <button data-k="bell">🔔</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
